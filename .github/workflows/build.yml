name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check the tag matches the mod version
        if: github.ref_type == 'tag'
        run: grep -qx "mod_version=${GITHUB_REF_NAME#v}" gradle.properties
      - run: ./gradlew build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: build/libs/*.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lucerna
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lucerna
      - name: Publish the GitHub release
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          grep -q . notes.md
          gh release create "$GITHUB_REF_NAME" ./*.jar --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          {
            echo "version=$version"
            echo 'notes<<EOF'
            cat notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@3870f66007063f03fb70118ca9eddbc09a4ba666 # v2.5.2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          name: Lucerna ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          changelog: ${{ steps.release.outputs.notes }}
          loaders: ornithe
          game-versions: 1.8.9
          environment: client_only
          files: lucerna-${{ steps.release.outputs.version }}.jar
          dependencies: |-
            [{"project_id": "QRMV06RW", "dependency_type": "required"}]
